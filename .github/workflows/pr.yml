name: Pull Request

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  lint:
    name: Lint (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run lint
        working-directory: apps/web

  typecheck:
    name: Typecheck (web)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run typecheck
        working-directory: apps/web

  build:
    name: Build (web, api, docker images)
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore apps/api/src/Vanta.Api/Vanta.Api.csproj
      - run: dotnet build apps/api/src/Vanta.Api/Vanta.Api.csproj --configuration Release --no-restore

      # Validates the production Dockerfiles actually build (small, reproducible,
      # non-root images) without pushing them anywhere.
      - name: Docker build (api)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/src/Vanta.Api/Dockerfile
          push: false
      - name: Docker build (web)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
      - name: Docker build (WhatsApp bridge)
        uses: docker/build-push-action@v6
        with:
          context: apps/whatsapp-bridge
          file: apps/whatsapp-bridge/Dockerfile
          push: false

  unit-tests:
    name: Unit tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore tests/unit/Vanta.Api.UnitTests.csproj
      # Excludes the small set of tests that require a real Postgres instance
      # (see docs/CI_CD.md) — those run in the integration-tests job instead.
      - run: >
          dotnet test tests/unit/Vanta.Api.UnitTests.csproj
          --configuration Release
          --no-restore
          --filter "FullyQualifiedName!~ConcurrencyTests&FullyQualifiedName!~KnowledgeSemanticSearchTests"

  integration-tests:
    name: Integration tests (real Postgres)
    needs: unit-tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: vanta
          POSTGRES_PASSWORD: vanta_dev_only
          POSTGRES_DB: vanta
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vanta -d vanta"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Apply EF Core migrations
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.*
          dotnet ef database update \
            --project apps/api/src/Vanta.Api/Vanta.Api.csproj \
            --startup-project apps/api/src/Vanta.Api/Vanta.Api.csproj
        env:
          ConnectionStrings__Default: "Host=localhost;Port=5432;Database=vanta;Username=vanta;Password=vanta_dev_only"
      - run: dotnet restore tests/unit/Vanta.Api.UnitTests.csproj
      - run: >
          dotnet test tests/unit/Vanta.Api.UnitTests.csproj
          --configuration Release
          --no-restore
          --filter "FullyQualifiedName~ConcurrencyTests|FullyQualifiedName~KnowledgeSemanticSearchTests"
