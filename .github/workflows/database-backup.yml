name: Production database backup

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

concurrency:
  group: production-database-backup
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  backup:
    name: Backup production PostgreSQL
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Create encrypted backup artifact
        env:
          VANTA_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.PRODUCTION_BACKUP_PASSPHRASE }}
        run: |
          test -n "$VANTA_DATABASE_URL"
          test -n "$BACKUP_PASSPHRASE"
          mkdir -p .backups
          timestamp="$(date -u +%Y%m%d-%H%M%S)"
          pg_dump --format=custom --no-owner --no-acl "$VANTA_DATABASE_URL" | \
            openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:BACKUP_PASSPHRASE \
            -out ".backups/vanta-${timestamp}.dump.enc"

      # Configure cloud credentials through the production environment's OIDC role.
      # The destination must be a private, versioned bucket with a lifecycle policy.
      - name: Upload backup to private object storage
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.PRODUCTION_BACKUP_AWS_ROLE_ARN }}
          aws-region: ${{ vars.PRODUCTION_BACKUP_AWS_REGION }}
      - name: Publish backup
        env:
          BACKUP_BUCKET_URI: ${{ secrets.PRODUCTION_BACKUP_BUCKET_URI }}
        run: |
          test -n "$BACKUP_BUCKET_URI"
          aws s3 cp .backups/*.dump.enc "$BACKUP_BUCKET_URI/" --sse AES256

      - name: Remove local backup artifact
        if: always()
        run: rm -rf .backups
